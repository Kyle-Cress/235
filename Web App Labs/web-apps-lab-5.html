<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-5</title>
	<style>
		body{
			font-family:sans-serif;
		}
		#colorform{
			background-color:#dfecdf;
			color: #111;
			padding:1em;width:400px;
		}
		#colorform p#info{
			background-color:white;
			color: black;
			width:300px;
			height:100px;
			padding:.5em;
		}
		
		#colorform legend{ 
			font-weight:bold;
			font-size:1.2em;
		}
	</style>
</head>
<body>

<div id="colorform">
	<legend>Choose your favorite color!</legend>
	<p><input type="radio" name="colorGroup" id="colorGroupRed" value="red" /> Red</p>
	<p><input type="radio" name="colorGroup" id="colorGroupGreen" value="green" /> Green</p>
	<p><input type="radio" name="colorGroup" id="colorGroupBlue" value="blue" /> Blue</p>
	<p><button id="colorButton" type="button">Submit</button></p>
	<p id="info"></p>
</div>

<script>
/* Write your code here! */
    let radioButtons = document.querySelectorAll("input");

    for (let i = 0; i < radioButtons.length; i++){
        radioButtons[i].addEventListener("change", ChooseColor)
    }

    let submitBtn = document.querySelector("button");
    submitBtn.addEventListener("click", Submit)

    let infoBox = document.getElementById("info");
	let legend = document.querySelector("legend");

    function ChooseColor(event){
		infoBox.innerHTML = "You have selected '" + event.target.value + "'!";
    }

    function Submit(){
		let checked = document.querySelectorAll("input:checked");
		checked.forEach((input) => {
			infoBox.innerHTML = "Your FINAL CHOICE IS '" + input.value +" '!";
			legend.style.color = input.value;
		})
    }
</script>
</body>
</html>
