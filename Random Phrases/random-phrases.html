<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Random Phrases</title>
    <style>
        html {
            height: 100%;
        }
        body {
            background-color: black;
            margin: 0;
            min-height: 100%;
            display: flex;
            align-items: center;      /* vertical centering */
            justify-content: center;  /* horizontal centering */
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
            box-sizing: border-box;
            width: min(90vw, 40rem);
            max-height: 96vh;
            padding: 0 0 3vh;
            overflow: hidden;
            background-color: midnightblue;
        }
        h1 {
            width: 100%;
            margin: 0;
            padding: 0.5em 0;
            box-sizing: border-box;
            background-color: purple;
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }
        img {
            display: block;
            max-width: 80%;
            max-height: 40vh;
            object-fit: contain;
        }
        p {
            width: 80%;
            min-height: 4rem;
            margin: 0;
            padding: 0.5rem;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: azure;
            font-size: clamp(1.25rem, 4vw, 2rem);
        }
        button {
            font-size: clamp(1rem, 3vw, 1.5rem);
            padding: 0.5em 1.25em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">MAGIC 8 BALL</h1>
        <img src="Magic8Ball.png" alt="Magic EightBall">
        <p id="resultBox"></p>
        <button type="button">ASK THE MAGIC 8 BALL</button>
    </div>

    <script>
        "use strict";

        let phrases = ["Yes", "No", "Ask me again", "It is decidedly so", "Outlook not so good", "Very doubtful", "No way José", "You may rely on it", "Most Likely", "Try Again", "Concentrate and ask again", "My sources say no", "I wouldn't count on it", "Nuh uh", "Obviously so", "With 100% certainty", "Try again on a rainy day"];

        let button = document.querySelector("button");
        button.addEventListener("click", RandomPhrase);

        let textBox = document.getElementById("resultBox");

        function RandomPhrase() {
            let response = phrases[Math.floor(Math.random() * phrases.length)];
            textBox.textContent = response;
        }

        window.onload = () => { RandomPhrase(); };
    </script>
</body>
</html>
